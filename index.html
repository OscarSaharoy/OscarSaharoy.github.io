<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oscar Saharoy - Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: #753498;
            --background-color: #000000;
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Libre Baskerville', serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            color: var(--primary-color);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .bio {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .social-link {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 2rem;
        }

        .email {
            font-size: 1rem;
            color: var(--primary-color);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Oscar Saharoy</h1>
        <div class="bio">
            <p>Hi, I'm Oscar! I love building new things and learning new skills. I'm currently working at Low Carbon Contracts Company in London.</p>
        </div>
        <div class="social-links">
            <a href="https://github.com/OscarSaharoy" target="_blank" class="social-link">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://linkedin.com/in/oscar-saharoy" target="_blank" class="social-link">
                <i class="fab fa-linkedin"></i>
            </a>
        </div>
        <div class="email">osaharoy at gmail dot com</div>
    </div>
</body>
</html>
